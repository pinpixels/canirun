name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not paste private data."
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and what you expected
    validations:
      required: true
